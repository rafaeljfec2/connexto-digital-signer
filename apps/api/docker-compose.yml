services:
  connexto-digital-signer-api:
    image: ${IMAGE:-connexto-digital-signer-api:local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/digital-signer/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - paasdeploy
    labels:
      paasdeploy.app: connexto-digital-signer-api
      traefik.enable: 'true'
      traefik.docker.network: paasdeploy
      traefik.http.routers.connexto-digital-signer-api.priority: '1'
      traefik.http.routers.connexto-digital-signer-api.rule: Host(`api-signer.connexto.com.br`)
      traefik.http.routers.connexto-digital-signer-api.service: connexto-digital-signer-api
      traefik.http.routers.connexto-digital-signer-api.tls: 'true'
      traefik.http.routers.connexto-digital-signer-api.tls.certresolver: letsencrypt
      traefik.http.services.connexto-digital-signer-api.loadbalancer.server.port: '3000'

networks:
  paasdeploy:
    external: true
